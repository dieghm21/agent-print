<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador de Recibos - Agente de Impresoras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .panel h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 500;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .items-container {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
        }

        .item-details {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .item-price {
            font-weight: 600;
            color: #667eea;
            font-size: 16px;
        }

        .remove-btn {
            background: #ff6b6b;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        .preview {
            background: #f0f0f0;
            border: 1px dashed #ccc;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            overflow: auto;
            max-height: 500px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .total-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .total-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .total-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }

        .add-item-btn {
            width: 100%;
            margin-bottom: 10px;
            background: #28a745;
        }

        .add-item-btn:hover {
            background: #218838;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel de Entrada -->
        <div class="panel">
            <h1>📝 Crear Recibo</h1>

            <div class="form-group">
                <label for="titulo">Nombre del Negocio</label>
                <input type="text" id="titulo" placeholder="ej: Café Aroma" value="☕ CAFÉ AROMA">
            </div>

            <div class="form-group">
                <label for="subtitulo">Dirección</label>
                <input type="text" id="subtitulo" placeholder="ej: Calle 123, Centro" value="Calle 123, Centro - Tel: (555) 123-4567">
            </div>

            <div class="form-group">
                <label for="ordenNum">Número de Orden</label>
                <input type="text" id="ordenNum" placeholder="ej: 00001" value="00001">
            </div>

            <h3 style="margin-top: 20px; color: #333; margin-bottom: 10px;">Artículos</h3>

            <div class="items-container" id="itemsList"></div>

            <button class="add-item-btn" onclick="addItem()">+ Agregar Artículo</button>

            <div class="totals">
                <div class="total-item">
                    <div class="total-label">Subtotal</div>
                    <div class="total-value" id="subtotalDisplay">$0.00</div>
                </div>
                <div class="total-item">
                    <div class="total-label">Impuesto</div>
                    <div class="total-value" id="taxDisplay">$0.00</div>
                </div>
                <div class="total-item">
                    <div class="total-label">TOTAL</div>
                    <div class="total-value" id="totalDisplay">$0.00</div>
                </div>
            </div>

            <div class="form-group">
                <label for="metodoPago">Método de Pago</label>
                <input type="text" id="metodoPago" placeholder="ej: Efectivo / Tarjeta" value="Tarjeta de Crédito">
            </div>

            <div class="form-group">
                <label for="pie">Pie de Página</label>
                <textarea id="pie" rows="3" placeholder="ej: ¡Gracias por su compra!&#10;Vuelva pronto">¡Gracias por su compra!
Vuelva pronto a Café Aroma
Somos amigo del ambiente</textarea>
            </div>

            <button onclick="printReceipt()" style="width: 100%; font-size: 18px; padding: 15px;">🖨️ Enviar a Imprimir</button>
            <div id="statusMsg"></div>
        </div>

        <!-- Panel de Vista Previa -->
        <div class="panel">
            <h1>👀 Vista Previa</h1>
            <div class="preview" id="preview">Aquí aparecerá la vista previa del recibo...</div>
        </div>
    </div>

    <script>
        let items = [
            { name: "Café Espresso Grande", desc: "Bebida caliente", qty: 2, price: 4.50 },
            { name: "Croissant de Chocolate", desc: "Recién hecho", qty: 1, price: 3.99 },
            { name: "Jugo Natural", desc: "Naranja fresca", qty: 1, price: 3.50 },
            { name: "Sándwich Premium", desc: "Jamón, queso y tomate", qty: 1, price: 7.99 }
        ];

        function addItem() {
            items.push({ name: "", desc: "", qty: 1, price: 0 });
            renderItems();
            updatePreview();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
            updatePreview();
        }

        function renderItems() {
            const container = document.getElementById('itemsList');
            container.innerHTML = items.map((item, idx) => `
                <div class="item">
                    <div class="item-info" style="flex: 1;">
                        <input type="text" placeholder="Nombre" value="${item.name}" 
                            onchange="items[${idx}].name = this.value; updatePreview();"
                            style="width: 100%; padding: 5px; margin-bottom: 5px;">
                        <input type="text" placeholder="Descripción" value="${item.desc}" 
                            onchange="items[${idx}].desc = this.value; updatePreview();"
                            style="width: 100%; padding: 5px; margin-bottom: 5px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                            <input type="number" placeholder="Cant" value="${item.qty}" min="1"
                                onchange="items[${idx}].qty = parseInt(this.value) || 1; updatePreview();"
                                style="padding: 5px;">
                            <input type="number" placeholder="Precio" value="${item.price}" min="0" step="0.01"
                                onchange="items[${idx}].price = parseFloat(this.value) || 0; updatePreview();"
                                style="padding: 5px;">
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${idx})">Eliminar</button>
                </div>
            `).join('');
        }

        function updatePreview() {
            const titulo = document.getElementById('titulo').value;
            const subtitulo = document.getElementById('subtitulo').value;
            const ordenNum = document.getElementById('ordenNum').value;
            const metodoPago = document.getElementById('metodoPago').value;
            const pie = document.getElementById('pie').value;

            let preview = '\n';
            
            // Centrar título
            if (titulo) {
                const spaces = Math.floor((42 - titulo.length) / 2);
                preview += ' '.repeat(Math.max(0, spaces)) + titulo + '\n';
            }
            
            // Centrar subtítulo
            if (subtitulo) {
                const spaces = Math.floor((42 - subtitulo.length) / 2);
                preview += ' '.repeat(Math.max(0, spaces)) + subtitulo + '\n';
            }
            
            preview += '='.repeat(42) + '\n';
            
            if (ordenNum) preview += `Orden: ${ordenNum}\n`;
            preview += `${new Date().toLocaleString()}\n`;
            preview += '-'.repeat(42) + '\n\n';

            // Items
            let subtotal = 0;
            items.forEach(item => {
                if (item.name) {
                    const total = item.qty * item.price;
                    subtotal += total;
                    preview += item.name + '\n';
                    if (item.desc) preview += `  ${item.desc}\n`;
                    const qty = `${item.qty}x`;
                    const price = `$${item.price.toFixed(2)}`;
                    const itemTotal = `$${total.toFixed(2)}`;
                    const spacing = 42 - qty.length - price.length - itemTotal.length - 3;
                    preview += `${qty} ${' '.repeat(spacing)} ${price} ${itemTotal}\n\n`;
                }
            });

            const tax = subtotal * 0.10;
            const total = subtotal + tax;

            document.getElementById('subtotalDisplay').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('taxDisplay').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('totalDisplay').textContent = `$${total.toFixed(2)}`;

            preview += '-'.repeat(42) + '\n';
            preview += `Subtotal`.padEnd(32) + `$${subtotal.toFixed(2)}`.padStart(10) + '\n';
            preview += `Impuesto`.padEnd(32) + `$${tax.toFixed(2)}`.padStart(10) + '\n';
            preview += '='.repeat(42) + '\n';
            preview += `TOTAL`.padEnd(32) + `$${total.toFixed(2)}`.padStart(10) + '\n';
            preview += '='.repeat(42) + '\n';

            if (metodoPago) preview += `\nPago: ${metodoPago}\n`;

            preview += '\n';
            if (pie) {
                pie.split('\n').forEach(line => {
                    const spaces = Math.floor((42 - line.length) / 2);
                    preview += ' '.repeat(Math.max(0, spaces)) + line + '\n';
                });
            }

            document.getElementById('preview').textContent = preview;
        }

        async function printReceipt() {
            const titulo = document.getElementById('titulo').value;
            const subtitulo = document.getElementById('subtitulo').value;
            const ordenNum = document.getElementById('ordenNum').value;
            const metodoPago = document.getElementById('metodoPago').value;
            const pie = document.getElementById('pie').value;

            const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
            const tax = subtotal * 0.10;
            const total = subtotal + tax;

            const validItems = items.filter(i => i.name);
            if (validItems.length === 0) {
                showStatus('error', '❌ Agregar al menos un artículo');
                return;
            }

            const receipt = {
                printerId: "pos80c-usb001-fixed",
                header: { title: titulo, subtitle: subtitulo },
                orderNumber: ordenNum,
                dateTime: new Date().toLocaleString(),
                items: validItems.map(item => ({
                    name: item.name,
                    description: item.desc,
                    quantity: item.qty,
                    price: item.price
                })),
                subtotal: subtotal,
                tax: tax,
                total: total,
                paymentMethod: metodoPago,
                footer: pie.split('\n'),
                cut: true
            };

            showStatus('pending', '⏳ Enviando recibo...');

            try {
                const response = await fetch('http://localhost:3002/api/print/receipt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(receipt)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('success', `✓ Recibo encolado (ID: ${result.jobId})`);
                } else {
                    showStatus('error', `❌ Error: ${result.error}`);
                }
            } catch (error) {
                showStatus('error', `❌ Error de conexión: ${error.message}`);
            }
        }

        function showStatus(type, message) {
            const msg = document.getElementById('statusMsg');
            msg.className = `status ${type}`;
            msg.textContent = message;
        }

        // Inicializar
        renderItems();
        updatePreview();
    </script>
</body>
</html>
